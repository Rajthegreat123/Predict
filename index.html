              <div class="score-grid-title" style="display:flex;align-items:center;gap:6px;">
                MOST LIKELY SCORELINES
                <span class="info-tooltip" title="Each scoreline's probability = P(home scores i goals) × P(away scores j goals), using a Poisson distribution with the calculated xG as the rate parameter. All 100 scorelines (0–9 each) are ranked and the top 6 shown.">ℹ️</span>
              </div>
              <div class="score-grid">
                ${r.topScores
                  .map(
                    (s, i) => `
                  <div class="score-cell ${i === 0 ? "top" : ""}">
                    ${i === 0 ? '<div style="font-size:9px;color:var(--accent);font-weight:700;letter-spacing:0.8px;margin-bottom:2px;">MOST LIKELY</div>' : ""}
                    <div class="sc">${s.score}</div>
                    <div class="sp">${(s.p * 100).toFixed(1)}% chance</div>
                  </div>`,
                  )
                  .join("")}
              </div>
            </div>

            <!-- Strength comparison -->
            <div style="border-top:1px solid var(--border);padding-top:14px;">
              <div class="score-grid-title">TEAM STRENGTHS</div>
              <div class="strength-grid">
                <div class="strength-item">
                  <div class="strength-label">⚔️ Attack (this season)</div>
                  <div style="display:flex;gap:4px;align-items:center;margin-bottom:3px;">
                    <div style="width:${hAttPct}%;height:5px;border-radius:3px;background:var(--accent);transition:width 0.5s"></div>
                  </div>
                  <div style="display:flex;gap:4px;align-items:center;">
                    <div style="width:${aAttPct}%;height:5px;border-radius:3px;background:var(--accent2);transition:width 0.5s"></div>
                  </div>
                  <div class="strength-vals" style="margin-top:4px;">
                    <span class="sv-h">${predictState.home.split(" ").slice(-1)[0]} ${r.strengthH.ha.toFixed(2)}×</span>
                    <span class="sv-a">${r.strengthA.aa.toFixed(2)}× ${predictState.away.split(" ").slice(-1)[0]}</span>
                  </div>
                </div>
                <div class="strength-item">
                  <div class="strength-label">🛡️ Defence (lower = better)</div>
                  <div style="display:flex;gap:4px;align-items:center;margin-bottom:3px;">
                    <div style="width:${hDefPct}%;height:5px;border-radius:3px;background:var(--accent);transition:width 0.5s"></div>
                  </div>
                  <div style="display:flex;gap:4px;align-items:center;">
                    <div style="width:${aDefPct}%;height:5px;border-radius:3px;background:var(--accent2);transition:width 0.5s"></div>
                  </div>
                  <div class="strength-vals" style="margin-top:4px;">
                    <span class="sv-h">${predictState.home.split(" ").slice(-1)[0]} ${r.strengthH.hd.toFixed(2)}×</span>
                    <span class="sv-a">${r.strengthA.ad.toFixed(2)}× ${predictState.away.split(" ").slice(-1)[0]}</span>
                  </div>
                </div>
              </div>
              <div style="font-size:11px;color:var(--muted);margin-top:6px;">
                ELO: <span style="color:var(--accent)">${predictState.home} ${Math.round(r.eloH)}</span>
                &nbsp;vs&nbsp;
                <span style="color:var(--accent2)">${predictState.away} ${Math.round(r.eloA)}</span>
              </div>
            </div>
          </div>`;

        result.classList.add("visible");
        requestAnimationFrame(() =>
          setTimeout(() => {
            const bh = document.getElementById("bar-home");
            const bd = document.getElementById("bar-draw");
            const ba = document.getElementById("bar-away");
            if (bh) bh.style.width = r.homeWin + "%";
            if (bd) bd.style.width = r.draw + "%";
            if (ba) ba.style.width = r.awayWin + "%";
          }, 30),
        );
      }

      function updateH2H() {
        const h = predictState.home,
          a = predictState.away;
        if (!h || !a) return;
        const hGames = (typeof MATCHES !== "undefined" ? MATCHES[h] : []) || [];
        const h2h = hGames
          .filter((m) => m.opponent === a)
          .sort((x, y) => y.date.localeCompare(x.date));
        const el = document.getElementById("h2h-content");
        if (!el) return;

        const COMP_FLAGS = {
          IT1: "🇮🇹",
          GB1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
          L1: "🇩🇪",
          FR1: "🇫🇷",
          ES1: "🇪🇸",
          CL: "🏆",
        };
        const formDot = (f, tip) =>
          `<span title="${tip}" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-size:11px;font-weight:700;background:${f === "W" ? "rgba(0,255,136,0.15)" : f === "D" ? "rgba(255,215,0,0.15)" : "rgba(255,62,108,0.15)"};color:${f === "W" ? "var(--win)" : f === "D" ? "var(--draw)" : "var(--loss)"}">${f}</span>`;

        // Recent form blocks for both teams
        const hHome = PRED.home_form[h] || [];
        const hAway = PRED.away_form[h] || [];
        const aHome = PRED.home_form[a] || [];
        const aAway = PRED.away_form[a] || [];
        const hHomePts = hHome.reduce(
          (s, r) => s + (r === "W" ? 3 : r === "D" ? 1 : 0),
          0,
        );
        const hAwayPts = hAway.reduce(
          (s, r) => s + (r === "W" ? 3 : r === "D" ? 1 : 0),
          0,
        );
        const aHomePts = aHome.reduce(
          (s, r) => s + (r === "W" ? 3 : r === "D" ? 1 : 0),
          0,
        );
        const aAwayPts = aAway.reduce(
          (s, r) => s + (r === "W" ? 3 : r === "D" ? 1 : 0),
          0,
        );

        const formSection = `
          <div style="border-bottom:1px solid var(--border);padding:14px 18px;">
            <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:10px;">RECENT FORM</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;">${h} <span style="font-size:10px;color:var(--muted);font-weight:400;">(Home)</span></div>
                <div style="font-size:10px;color:var(--muted);margin-bottom:3px;">📅 Last 5 Overall</div>
                <div style="display:flex;gap:3px;margin-bottom:8px;">
                  ${
                    (PRED.home_form[h] || [])
                      .concat(PRED.away_form[h] || [])
                      .slice(-5)
                      .map((f) =>
                        formDot(
                          f,
                          f === "W" ? "Win" : f === "D" ? "Draw" : "Loss",
                        ),
                      )
                      .join("") ||
                    '<span style="color:var(--muted);font-size:11px;">No data</span>'
                  }
                </div>
                <div style="font-size:10px;color:var(--muted);margin-bottom:3px;">🏠 Last 5 Home</div>
                <div style="display:flex;gap:3px;">
                  ${hHome.length ? hHome.map((f) => formDot(f, f === "W" ? "Win" : f === "D" ? "Draw" : "Loss")).join("") : '<span style="color:var(--muted);font-size:11px;">No data</span>'}
                  <span style="margin-left:4px;font-size:11px;color:var(--muted);align-self:center;">${hHome.length ? hHomePts + "/" + 3 * hHome.length + " pts" : ""}</span>
                </div>
              </div>
              <div>
                <div style="font-size:12px;font-weight:600;color:var(--accent2);margin-bottom:8px;">${a} <span style="font-size:10px;color:var(--muted);font-weight:400;">(Away)</span></div>
                <div style="font-size:10px;color:var(--muted);margin-bottom:3px;">📅 Last 5 Overall</div>
                <div style="display:flex;gap:3px;margin-bottom:8px;">
                  ${
                    (PRED.home_form[a] || [])
                      .concat(PRED.away_form[a] || [])
                      .slice(-5)
                      .map((f) =>
                        formDot(
                          f,
                          f === "W" ? "Win" : f === "D" ? "Draw" : "Loss",
                        ),
                      )
                      .join("") ||
                    '<span style="color:var(--muted);font-size:11px;">No data</span>'
                  }
                </div>
                <div style="font-size:10px;color:var(--muted);margin-bottom:3px;">✈️ Last 5 Away</div>
                <div style="display:flex;gap:3px;">
                  ${aAway.length ? aAway.map((f) => formDot(f, f === "W" ? "Win" : f === "D" ? "Draw" : "Loss")).join("") : '<span style="color:var(--muted);font-size:11px;">No data</span>'}
                  <span style="margin-left:4px;font-size:11px;color:var(--muted);align-self:center;">${aAway.length ? aAwayPts + "/" + 3 * aAway.length + " pts" : ""}</span>
                </div>
              </div>
            </div>
          </div>`;

        if (!h2h.length) {
          el.innerHTML =
            formSection +
            `<div class="h2h-empty" style="padding:24px;">No head-to-head matches found between ${h} and ${a} in this dataset.</div>`;
          return;
        }

        let hWins = 0,
          draws = 0,
          aWins = 0,
          hGF = 0,
          hGA = 0;
        for (const m of h2h) {
          hGF += m.gf;
          hGA += m.ga;
          if (m.gf > m.ga) hWins++;
          else if (m.gf === m.ga) draws++;
          else aWins++;
        }

        el.innerHTML =
          formSection +
          `
          <div class="h2h-summary">
            <div class="h2h-stat">
              <div class="h2h-val" style="color:var(--accent)">${hWins}</div>
              <div class="h2h-lbl">${h.split(" ").slice(-1)[0]} Wins</div>
            </div>
            <div class="h2h-stat">
              <div class="h2h-val" style="color:var(--draw)">${draws}</div>
              <div class="h2h-lbl">Draws</div>
            </div>
            <div class="h2h-stat">
              <div class="h2h-val" style="color:var(--accent2)">${aWins}</div>
              <div class="h2h-lbl">${a.split(" ").slice(-1)[0]} Wins</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:90px 1fr 56px 1fr 36px;gap:8px;padding:8px 18px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);text-transform:uppercase;">
            <span>Date</span><span style="text-align:right">Home</span><span style="text-align:center">Score</span><span>Away</span><span style="text-align:center">Comp</span>
          </div>
          <div class="h2h-list">
            ${h2h
              .map((m) => {
                const isHome = m.venue === "H";
                const homeTeam = isHome ? h : a;
                const awayTeam = isHome ? a : h;
                const hScore = isHome ? m.gf : m.ga;
                const aScore = isHome ? m.ga : m.gf;
                const res = m.gf > m.ga ? "W" : m.gf === m.ga ? "D" : "L";
                const resColor =
                  res === "W"
                    ? "var(--win)"
                    : res === "D"
                      ? "var(--draw)"
                      : "var(--loss)";
                return `<div class="h2h-row">
                <span class="h2h-date">${m.date}</span>
                <span class="h2h-home">${homeTeam}</span>
                <span class="h2h-score">${hScore}–${aScore}</span>
                <span class="h2h-away">${awayTeam}</span>
                <span style="color:${resColor};font-size:12px;font-weight:700;text-align:center;">${COMP_FLAGS[m.competition] || m.competition}</span>
              </div>`;
              })
              .join("")}
          </div>
          <div style="padding:10px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);">
            ${h2h.length} H2H matches · ${h} record in these games: <span style="color:var(--win)">${hGF} scored</span>, <span style="color:var(--loss)">${hGA} conceded</span>
          </div>`;
      }

      initApp();
    </script>
  </body>
</html>
