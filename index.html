<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0c10;
        --surface: #111418;
        --surface2: #181c22;
        --surface3: #1e2330;
        --border: #252a35;
        --accent: #00d4ff;
        --accent2: #ff3e6c;
        --accent3: #00ff88;
        --gold: #ffd700;
        --text: #e8eaf0;
        --muted: #6b7385;
        --win: #00ff88;
        --draw: #ffd700;
        --loss: #ff3e6c;
      }
      html {
        height: 100%;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        height: 100%;
        overflow: hidden;
        display: flex;
      }

      header {
        width: 280px;
        min-width: 280px;
        height: 100vh;
        background: linear-gradient(
          180deg,
          #0a0c10 0%,
          #111827 50%,
          #0a0c10 100%
        );
        border-right: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(20px);
        overflow-y: auto;
      }
      .header-inner {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
        padding: 28px 20px;
        height: 100%;
      }
      .logo {
        font-family: "Bebas Neue", cursive;
        font-size: 26px;
        letter-spacing: 3px;
        background: linear-gradient(135deg, var(--accent), var(--accent3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        white-space: nowrap;
        cursor: pointer;
      }
      .nav-tabs {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .nav-tabs::-webkit-scrollbar {
        display: none;
      }
      .nav-tab {
        width: 100%;
        text-align: left;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
        letter-spacing: 0.3px;
      }
      .nav-tab:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .nav-tab.active {
        background: var(--surface3);
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 16px rgba(0, 212, 255, 0.12);
      }
      .search-wrap {
        position: relative;
        margin-top: auto;
      }
      .search-input {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px 8px 36px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        width: 200px;
        outline: none;
        transition: all 0.2s;
      }
      .search-input:focus {
        border-color: var(--accent);
        width: 240px;
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.1);
      }
      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
      }
      .search-results {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: 280px;
        max-height: 320px;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        z-index: 200;
        display: none;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .search-results.open {
        display: block;
      }
      .search-result-item {
        padding: 10px 14px;
        cursor: pointer;
        transition: background 0.15s;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .search-result-item:last-child {
        border-bottom: none;
      }
      .search-result-item:hover {
        background: var(--surface3);
      }
      .search-result-league {
        font-size: 11px;
        color: var(--muted);
      }

      main {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding: 28px 24px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
        animation: fadeIn 0.25s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .league-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .league-title {
        font-family: "Bebas Neue", cursive;
        font-size: 36px;
        letter-spacing: 2px;
        color: var(--text);
      }
      .league-badge {
        font-size: 28px;
      }
      .table-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .filter-select,
      .sort-select {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
      }
      .filter-select:focus {
        border-color: var(--accent);
      }

      /* TOGGLE SWITCH */
      .toggle-group {
        display: flex;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px;
        gap: 2px;
      }
      .toggle-btn {
        padding: 7px 18px;
        border-radius: 7px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        letter-spacing: 0.2px;
      }
      .toggle-btn:hover {
        color: var(--text);
      }
      .toggle-btn.active {
        background: var(--surface3);
        color: var(--accent);
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
        border: 1px solid rgba(0, 212, 255, 0.3);
      }

      .table-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
      }
      .standings-table {
        width: 100%;
        border-collapse: collapse;
      }
      .standings-table th {
        background: var(--surface2);
        padding: 12px 14px;
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        transition: color 0.15s;
      }
      .standings-table th:hover {
        color: var(--accent);
      }
      .standings-table th.sorted {
        color: var(--accent);
      }
      .standings-table th .sort-arrow {
        margin-left: 4px;
        opacity: 0.5;
      }
      .standings-table th.sorted .sort-arrow {
        opacity: 1;
      }
      .standings-table td {
        padding: 11px 14px;
        font-size: 14px;
        border-bottom: 1px solid rgba(37, 42, 53, 0.6);
        white-space: nowrap;
      }
      .standings-table tbody tr {
        cursor: pointer;
        transition: background 0.15s;
      }
      .standings-table tbody tr:hover {
        background: var(--surface2);
      }
      .standings-table tbody tr:last-child td {
        border-bottom: none;
      }
      .pos-cell {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--muted);
        width: 40px;
        text-align: center;
      }
      .pos-marker {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        font-family: "JetBrains Mono", monospace;
      }
      .pos-cl {
        background: rgba(0, 212, 255, 0.15);
        color: var(--accent);
      }
      .pos-el {
        background: rgba(255, 135, 0, 0.15);
        color: #ff8700;
      }
      .pos-conf {
        background: rgba(0, 255, 136, 0.1);
        color: var(--accent3);
      }
      .pos-rel {
        background: rgba(255, 62, 108, 0.15);
        color: var(--accent2);
      }
      .pos-normal {
        background: var(--surface2);
        color: var(--muted);
      }
      .team-cell {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        font-size: 14px;
      }
      .team-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        letter-spacing: 0.5px;
      }
      .stat-cell {
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }
      .gd-positive {
        color: var(--win);
      }
      .gd-negative {
        color: var(--loss);
      }
      .pts-cell {
        font-family: "Bebas Neue", cursive;
        font-size: 20px;
        letter-spacing: 1px;
        color: var(--text);
        text-align: center;
      }
      .form-dots {
        display: flex;
        gap: 3px;
        align-items: center;
      }
      .form-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .form-dot.W {
        background: var(--win);
        box-shadow: 0 0 6px var(--win);
      }
      .form-dot.D {
        background: var(--draw);
      }
      .form-dot.L {
        background: var(--loss);
      }
      .standings-table th.sorted-asc .sort-arrow::after {
        content: " ↑";
      }
      .standings-table th.sorted-desc .sort-arrow::after {
        content: " ↓";
      }

      /* CL specific */
      .cl-section {
        margin-bottom: 32px;
      }
      .section-title {
        font-family: "Bebas Neue", cursive;
        font-size: 20px;
        letter-spacing: 1.5px;
        color: var(--muted);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* Bracket */
      .bracket-container {
        display: flex;
        gap: 0;
        overflow-x: auto;
        padding-bottom: 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .bracket-round {
        min-width: 220px;
        flex-shrink: 0;
      }
      .bracket-round-title {
        font-family: "Bebas Neue", cursive;
        font-size: 16px;
        letter-spacing: 1.5px;
        color: var(--muted);
        padding: 0 12px 12px;
        text-align: center;
      }
      .bracket-match {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin: 6px 8px;
        padding: 10px 12px;
        transition: border-color 0.15s;
      }
      .bracket-match:hover {
        border-color: var(--accent);
      }
      .bracket-team {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
        font-size: 13px;
      }
      .bracket-score {
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        font-size: 13px;
        color: var(--accent);
      }
      .bracket-team.winner {
        color: var(--text);
        font-weight: 600;
      }
      .bracket-team.loser {
        color: var(--muted);
      }
      .bracket-divider {
        height: 1px;
        background: var(--border);
        margin: 2px 0;
      }

      /* Overview */
      .overview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }
      .league-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s;
      }
      .league-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
      }
      .league-card-header {
        padding: 18px 20px;
        background: var(--surface2);
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }
      .league-card-flag {
        font-size: 24px;
      }
      .league-card-name {
        font-family: "Bebas Neue", cursive;
        font-size: 22px;
        letter-spacing: 1.5px;
      }
      .league-card-body {
        padding: 14px 20px;
      }
      .mini-table-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
        border-bottom: 1px solid rgba(37, 42, 53, 0.4);
        font-size: 13px;
      }
      .mini-table-row:last-child {
        border-bottom: none;
      }
      .mini-pos {
        width: 20px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
      }
      .mini-name {
        flex: 1;
        font-weight: 500;
      }
      .mini-pts {
        font-family: "Bebas Neue", cursive;
        font-size: 18px;
      }

      /* ELO */
      .elo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .elo-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .elo-card:hover {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .elo-rank {
        font-family: "Bebas Neue", cursive;
        font-size: 28px;
        color: var(--muted);
        width: 36px;
        text-align: center;
      }
      .elo-rank.top3 {
        color: var(--gold);
      }
      .elo-info {
        flex: 1;
      }
      .elo-name {
        font-weight: 600;
        font-size: 14px;
      }
      .elo-league {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .elo-bar-wrap {
        width: 100%;
        background: var(--surface3);
        border-radius: 4px;
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
      }
      .elo-bar {
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent3));
      }
      .elo-value {
        font-family: "Bebas Neue", cursive;
        font-size: 22px;
        color: var(--gold);
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal-overlay.open {
        display: flex;
        animation: fadeIn 0.2s ease;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        width: 100%;
        max-width: 900px;
        max-height: 88vh;
        overflow-y: auto;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        position: relative;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .modal-header {
        padding: 28px 28px 20px;
        background: linear-gradient(135deg, var(--surface2), var(--surface3));
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        border-radius: 18px 18px 0 0;
        z-index: 10;
      }
      .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--surface3);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        font-size: 18px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .modal-close:hover {
        color: var(--text);
        border-color: var(--accent2);
      }
      .modal-team-name {
        font-family: "Bebas Neue", cursive;
        font-size: 40px;
        letter-spacing: 2px;
      }
      .modal-meta {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .modal-stat-badge {
        background: var(--surface3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .elo-badge {
        color: var(--gold);
        border-color: rgba(255, 215, 0, 0.3);
      }
      .league-badge-small {
        color: var(--accent);
        border-color: rgba(0, 212, 255, 0.3);
      }
      .modal-body {
        padding: 24px 28px;
      }
      .modal-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 12px;
        margin-bottom: 28px;
      }
      .mini-stat {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        text-align: center;
      }
      .mini-stat-value {
        font-family: "Bebas Neue", cursive;
        font-size: 30px;
        letter-spacing: 1px;
      }
      .mini-stat-label {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.8px;
        margin-top: 2px;
      }
      .win-value {
        color: var(--win);
      }
      .draw-value {
        color: var(--draw);
      }
      .loss-value {
        color: var(--loss);
      }
      .filter-pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .pill {
        padding: 5px 13px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.3px;
      }
      .pill:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .pill.active {
        background: rgba(0, 212, 255, 0.1);
        border-color: var(--accent);
        color: var(--accent);
      }
      .match-history-table {
        width: 100%;
        border-collapse: collapse;
      }
      .match-history-table th {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .match-history-table td {
        padding: 9px 10px;
        font-size: 13px;
        border-bottom: 1px solid rgba(37, 42, 53, 0.5);
      }
      .match-history-table tbody tr:last-child td {
        border-bottom: none;
      }
      .result-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
      }
      .result-W {
        background: rgba(0, 255, 136, 0.15);
        color: var(--win);
      }
      .result-D {
        background: rgba(255, 215, 0, 0.15);
        color: var(--draw);
      }
      .result-L {
        background: rgba(255, 62, 108, 0.15);
        color: var(--loss);
      }
      .venue-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        background: var(--surface3);
        font-family: "JetBrains Mono", monospace;
      }
      .score-mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 600;
      }
      .date-cell {
        color: var(--muted);
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
      }
      .comp-pill {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        letter-spacing: 0.3px;
        background: var(--surface3);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      @media (max-width: 900px) {

  <body>
    <header>
      <div class="header-inner">
        <div class="logo" onclick="setView('overview')">⚽ FOOTBALL HUB</div>
        <div class="nav-tabs" id="navTabs"></div>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input
            class="search-input"
            id="searchInput"
            placeholder="Search team..."
            autocomplete="off"
          />
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
    </header>
    <main>
      <div class="view active" id="view-overview"></div>
      <div class="view" id="view-IT1"></div>
      <div class="view" id="view-GB1"></div>
      <div class="view" id="view-L1"></div>
      <div class="view" id="view-FR1"></div>
      <div class="view" id="view-ES1"></div>
      <div class="view" id="view-CL"></div>
      <div class="view" id="view-elo"></div>
      <div class="view" id="view-compare"></div>
      <div class="view" id="view-predict"></div>
    </main>
    <div
      class="modal-overlay"
      id="modalOverlay"
      onclick="if (event.target === this) closeModal();"
    >
      <div class="modal" id="modal"></div>
    </div>
    <script>
      const LEAGUES = {
        IT1: "Serie A",
        GB1: "Premier League",
        L1: "Bundesliga",
        FR1: "Ligue 1",
        ES1: "La Liga",
        CL: "Champions League",
      };
      const FLAGS = {
        IT1: "🇮🇹",
        GB1: "🇬🇧",
        L1: "🇩🇪",
        FR1: "🇫🇷",
        ES1: "🇪🇸",
        CL: "🏆",
      };
      let TABLES = {};
      let CL_GROUP_TABLE = [];
      let MATCHES = {};
      let CLUB_STATS = {};

      function parseCSV(text) {
        const lines = text.trim().split(/\r?\n/).filter(Boolean);
        const headers = lines[0].split(",");
        return lines.slice(1).map((line) => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] ? values[index].trim() : "";
          });
          return row;
        });
      }

      function ensureArrayEntry(map, key) {
        if (!map[key]) map[key] = [];
        return map[key];
      }

      function buildLeagueTables(rows) {
        TABLES = { IT1: [], GB1: [], L1: [], FR1: [], ES1: [] };
        const leagueStats = {
          IT1: {},
          GB1: {},
          L1: {},
          FR1: {},
          ES1: {},
        };

        const leagueRows = rows.filter((row) =>
          TABLES.hasOwnProperty(row.competition_id),
        );
        leagueRows.sort((a, b) => a.date.localeCompare(b.date));

        leagueRows.forEach((row) => {
          const comp = row.competition_id;
          const home = row.home_club_name;
          const away = row.away_club_name;
          const [hg, ag] = row.aggregate
            .split(":")
            .map((v) => parseInt(v, 10) || 0);

          if (!leagueStats[comp][home]) {
            leagueStats[comp][home] = {
              name: home,
              P: 0,
              W: 0,
              D: 0,
              L: 0,
              GF: 0,
              GA: 0,
              GD: 0,
              Pts: 0,
              form: [],
            };
          }
          if (!leagueStats[comp][away]) {
            leagueStats[comp][away] = {
              name: away,
              P: 0,
              W: 0,
              D: 0,
              L: 0,
              GF: 0,
              GA: 0,
              GD: 0,
              Pts: 0,
              form: [],
            };
          }

          const homeRec = leagueStats[comp][home];
          const awayRec = leagueStats[comp][away];

          homeRec.P += 1;
          awayRec.P += 1;
          homeRec.GF += hg;
          homeRec.GA += ag;
          awayRec.GF += ag;
          awayRec.GA += hg;
          homeRec.GD = homeRec.GF - homeRec.GA;
          awayRec.GD = awayRec.GF - awayRec.GA;

          if (hg > ag) {
            homeRec.W += 1;
            homeRec.Pts += 3;
            awayRec.L += 1;
            homeRec.form.push("W");
            awayRec.form.push("L");
          } else if (hg < ag) {
            awayRec.W += 1;
            awayRec.Pts += 3;
            homeRec.L += 1;
            homeRec.form.push("L");
            awayRec.form.push("W");
          } else {
            homeRec.D += 1;
            awayRec.D += 1;
            homeRec.Pts += 1;
            awayRec.Pts += 1;
            homeRec.form.push("D");
            awayRec.form.push("D");
          }

          if (homeRec.form.length > 5) homeRec.form.shift();
          if (awayRec.form.length > 5) awayRec.form.shift();
        });

        Object.keys(TABLES).forEach((lid) => {
          TABLES[lid] = Object.values(leagueStats[lid]).sort((a, b) => {
            if (b.Pts !== a.Pts) return b.Pts - a.Pts;
            if (b.GD !== a.GD) return b.GD - a.GD;
            if (b.GF !== a.GF) return b.GF - a.GF;
            return a.name.localeCompare(b.name);
          });
        });
      }

      function buildCLGroupTable(rows) {
        const stats = {};
        const groupRows = rows.filter(
          (row) =>
            row.competition_id === "CL" &&
            row.round.toLowerCase().includes("group"),
        );
        groupRows.sort((a, b) => a.date.localeCompare(b.date));

        groupRows.forEach((row) => {
          const home = row.home_club_name;
          const away = row.away_club_name;
          const [hg, ag] = row.aggregate
            .split(":")
            .map((v) => parseInt(v, 10) || 0);

          if (!stats[home]) {
            stats[home] = {
              name: home,
              P: 0,
              W: 0,
              D: 0,
              L: 0,
              GF: 0,
              GA: 0,
              GD: 0,
              Pts: 0,
              form: [],
            };
          }
          if (!stats[away]) {
            stats[away] = {
              name: away,
              P: 0,
              W: 0,
              D: 0,
              L: 0,
              GF: 0,
              GA: 0,
              GD: 0,
              Pts: 0,
              form: [],
            };
          }

          const homeRec = stats[home];
          const awayRec = stats[away];
          homeRec.P += 1;
          awayRec.P += 1;
          homeRec.GF += hg;
          homeRec.GA += ag;
          awayRec.GF += ag;
          awayRec.GA += hg;
          homeRec.GD = homeRec.GF - homeRec.GA;
          awayRec.GD = awayRec.GF - awayRec.GA;

          if (hg > ag) {
            homeRec.W += 1;
            homeRec.Pts += 3;
            awayRec.L += 1;
            homeRec.form.push("W");
            awayRec.form.push("L");
          } else if (hg < ag) {
            awayRec.W += 1;
            awayRec.Pts += 3;
            homeRec.L += 1;
            homeRec.form.push("L");
            awayRec.form.push("W");
          } else {
            homeRec.D += 1;
            awayRec.D += 1;
            homeRec.Pts += 1;
            awayRec.Pts += 1;
            homeRec.form.push("D");
            awayRec.form.push("D");
          }

          if (homeRec.form.length > 5) homeRec.form.shift();
          if (awayRec.form.length > 5) awayRec.form.shift();
        });

        return Object.values(stats).sort((a, b) => {
          if (b.Pts !== a.Pts) return b.Pts - a.Pts;
          if (b.GD !== a.GD) return b.GD - a.GD;
          if (b.GF !== a.GF) return b.GF - a.GF;
          return a.name.localeCompare(b.name);
        });
      }

      async function loadData() {
        const [clubStatsRes, csvRes] = await Promise.all([
          fetch("./club_stats.json"),
          fetch("./cleaned_games.csv"),
        ]);
        if (!clubStatsRes.ok)
          throw new Error(
            "Unable to load club_stats.json: " + clubStatsRes.statusText,
          );
        if (!csvRes.ok)
          throw new Error(
            "Unable to load cleaned_games.csv: " + csvRes.statusText,
          );

        CLUB_STATS = await clubStatsRes.json();
        const csvText = await csvRes.text();
        const rows = parseCSV(csvText);

        MATCHES = {};
        rows.forEach((row) => {
          const competition = row.competition_id;
          const home = row.home_club_name;
          const away = row.away_club_name;
          const date = row.date;
          const round = row.round;
          const [hg, ag] = row.aggregate
            .split(":")
            .map((v) => parseInt(v, 10) || 0);

          ensureArrayEntry(MATCHES, home).push({
            competition,
            date,
            round,
            venue: "H",
            opponent: away,
            gf: hg,
            ga: ag,
          });
          ensureArrayEntry(MATCHES, away).push({
            competition,
            date,
            round,
            venue: "A",
            opponent: home,
            gf: ag,
            ga: hg,
          });
        });

        buildLeagueTables(rows);
        CL_GROUP_TABLE = buildCLGroupTable(rows);
      }

      const TEAM_COLORS = [
        "#e74c3c",
        "#3498db",
        "#2ecc71",
        "#f39c12",
        "#9b59b6",
        "#1abc9c",
        "#e67e22",
        "#34495e",
        "#e91e63",
        "#00bcd4",
        "#ff5722",
        "#607d8b",
        "#795548",
        "#4caf50",
        "#ff9800",
        "#2196f3",
        "#673ab7",
        "#009688",
      ];
      const teamColorCache = {};
      function getTeamColor(name) {
        if (!teamColorCache[name]) {
          let hash = 0;
          for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
          teamColorCache[name] =
            TEAM_COLORS[Math.abs(hash) % TEAM_COLORS.length];
        }
        return teamColorCache[name];
      }
      function teamInitials(name) {
        return name
          .split(" ")
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }

      // ── Logo helpers ──────────────────────────────────────────────
      // TheSportsDB free tier: no API key needed for basic team search
      const LOGO_CACHE = {}; // name → img URL or null
      const LOGO_PENDING = {}; // name → [callback, ...]

      // League logos from TheSportsDB (hardcoded IDs for the 6 competitions)
      const LEAGUE_LOGO_IDS = {
        GB1: "4328", // Premier League
        ES1: "4335", // La Liga
        IT1: "4332", // Serie A
        L1: "4331", // Bundesliga
        FR1: "4334", // Ligue 1
        CL: "4480", // UEFA Champions League
      };

      function leagueLogoHtml(lid, size = 24) {
        const id = LEAGUE_LOGO_IDS[lid];
        if (!id)
          return `<span style="font-size:${size}px;">${FLAGS[lid] || ""}</span>`;
        return `<img src="https://www.thesportsdb.com/images/media/league/badge/i6ksun1549879062.png"
          onerror="this.style.display='none';this.nextSibling.style.display='inline'"
          style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;">
          <span style="display:none;font-size:${Math.round(size * 0.8)}px;">${FLAGS[lid] || ""}</span>`;
      }

      function fetchTeamLogo(name, cb) {
        if (LOGO_CACHE[name] !== undefined) {
          cb(LOGO_CACHE[name]);
          return;
        }
        if (LOGO_PENDING[name]) {
          LOGO_PENDING[name].push(cb);
          return;
        }
        LOGO_PENDING[name] = [cb];
        const query = encodeURIComponent(name);
        fetch(
          `https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${query}`,
        )
          .then((r) => r.json())
          .then((data) => {
            const team = data.teams?.[0];
            const url = team?.strTeamBadge || null;
            LOGO_CACHE[name] = url;
            (LOGO_PENDING[name] || []).forEach((fn) => fn(url));
            delete LOGO_PENDING[name];
          })
          .catch(() => {
            LOGO_CACHE[name] = null;
            (LOGO_PENDING[name] || []).forEach((fn) => fn(null));
            delete LOGO_PENDING[name];
          });
      }

      // Returns an <img> that lazy-loads; falls back to initials avatar
      function teamLogoHtml(name, size = 28, extraStyle = "") {
        const col = getTeamColor(name);
        const init = teamInitials(name);
        const id = `tl-${name.replace(/[^a-z0-9]/gi, "_")}-${size}`;
        // Defer fetch+swap until after this HTML string is inserted into the DOM
        setTimeout(() => {
          fetchTeamLogo(name, (url) => {
            if (!url) return;
            document.querySelectorAll(`[data-tl="${id}"]`).forEach((el) => {
              el.innerHTML = `<img src="${url}/preview"
                style="width:${size}px;height:${size}px;border-radius:50%;object-fit:contain;background:#fff;padding:2px;"
                onerror="this.style.display='none';this.nextSibling.style.display='flex'">
                <div style="display:none;width:${size}px;height:${size}px;border-radius:50%;background:${col};align-items:center;justify-content:center;font-size:${Math.round(size * 0.38)}px;font-weight:700;color:#fff;">${init}</div>`;
            });
          });
        }, 0);
        return `<span data-tl="${id}" style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;flex-shrink:0;${extraStyle}"><div style="width:${size}px;height:${size}px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size * 0.38)}px;font-weight:700;color:#fff;">${init}</div></span>`;
      }
      // ─────────────────────────────────────────────────────────────

      // Removed "overview" from VIEWS to exclude it from the navigation tabs
      const VIEWS = [...Object.keys(LEAGUES), "elo", "compare", "predict"];
      const VIEW_LABELS = {
        // Removed "overview" label
        ...Object.fromEntries(Object.entries(LEAGUES)),
        elo: "ELO Rankings",
        compare: "Compare Teams",
        predict: "Match Predictor",
      };
      // Removed "overview" flag
      const VIEW_FLAGS = { ...FLAGS, elo: "📊", compare: "⚖️", predict: "🔮" };

      let currentView = "overview";
      let sortState = {};
      let matchFilterState = {};
      // CL view toggle: 'group' or 'knockout'
      let clViewMode = "group";
      let clSortState = { col: "Pts", asc: false };
      let compareTeam1 = "";
      let compareTeam2 = "";
      let eloLeagueFilter = "";

      function setView(v) {
        document
          .querySelectorAll(".view")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById("view-" + v).classList.add("active");
        document
          .querySelectorAll(".nav-tab")
          .forEach((el) => el.classList.remove("active"));
        document.querySelector(`[data-view="${v}"]`)?.classList.add("active");
        currentView = v;
        renderView(v);
      }

      function buildNav() {
        const nav = document.getElementById("navTabs");
        nav.innerHTML = VIEWS.map(
          (v) =>
            `<button class="nav-tab" data-view="${v}" onclick="setView('${v}')">${VIEW_FLAGS[v]} ${VIEW_LABELS[v]}</button>`,
        ).join("");
      }

      function renderView(v) {
        if (v === "overview") renderOverview();
        else if (v === "elo") renderElo();
        else if (v === "CL") renderCL();
        else if (v === "compare") renderCompare();
        else if (v === "predict") renderPredict();
        else renderLeague(v);
      }

      // COMPARE VIEW
      function renderCompare() {
        const el = document.getElementById("view-compare");
        const allTeams = Object.keys(MATCHES).sort();
        el.innerHTML = `
          <div class="league-header">
            <span class="league-badge">⚖️</span>
            <span class="league-title">Team Comparison</span>
          </div>
          <div style="display: flex; gap: 20px; margin-bottom: 24px; align-items: center;">
            <select class="filter-select" id="comp1" onchange="updateCompare(1, this.value)" style="flex:1; height: 45px; font-size: 14px;">
              <option value="">Select Team 1</option>
              ${allTeams.map((t) => `<option value="${t}" ${t === compareTeam1 ? "selected" : ""}>${t}</option>`).join("")}
            </select>
            <div style="font-family:'Bebas Neue',cursive; font-size: 24px; color: var(--muted);">VS</div>
            <select class="filter-select" id="comp2" onchange="updateCompare(2, this.value)" style="flex:1; height: 45px; font-size: 14px;">
              <option value="">Select Team 2</option>
              ${allTeams.map((t) => `<option value="${t}" ${t === compareTeam2 ? "selected" : ""}>${t}</option>`).join("")}
            </select>
          </div>
          <div id="compare-results">
            ${renderComparisonContent()}
          </div>`;
      }

      function updateCompare(side, val) {
        if (side === 1) compareTeam1 = val;
        else compareTeam2 = val;
        document.getElementById("compare-results").innerHTML =
          renderComparisonContent();
      }

      function getTeamStats(name) {
        if (!name) return null;
        const ms = MATCHES[name] || [];
        const stats = CLUB_STATS[name] || {};
        let W = 0,
          D = 0,
          L = 0,
          GF = 0,
          GA = 0;
        for (const m of ms) {
          GF += m.gf;
          GA += m.ga;
          if (m.gf > m.ga) W++;
          else if (m.gf === m.ga) D++;
          else L++;
        }
        let form = [];
        for (const lid in TABLES) {
          const team = TABLES[lid].find((t) => t.name === name);
          if (team) {
            form = team.form;
            break;
          }
        }
        if (form.length === 0) {
          const team = CL_GROUP_TABLE.find((t) => t.name === name);
          if (team) form = team.form;
        }
        return {
          elo: Math.round(stats.elo || 0),
          gp: ms.length,
          w: W,
          d: D,
          l: L,
          gf: GF,
          ga: GA,
          gd: GF - GA,
          pts: W * 3 + D,
          form: form,
        };
      }

      function renderComparisonContent() {
        if (!compareTeam1 || !compareTeam2) {
          return `<div style="text-align:center; padding: 80px 40px; color: var(--muted); background: var(--surface); border-radius: 14px; border: 1px dashed var(--border); font-size: 14px;">Select two teams to compare performance</div>`;
        }
        const s1 = getTeamStats(compareTeam1);
        const s2 = getTeamStats(compareTeam2);
        const rows = [
          { label: "ELO RATING", key: "elo", higher: true },
          { label: "GAMES PLAYED", key: "gp", higher: true },
          { label: "WINS", key: "w", higher: true },
          { label: "DRAWS", key: "d", higher: false },
          { label: "LOSSES", key: "l", higher: false },
          { label: "GOALS FOR", key: "gf", higher: true },
          { label: "GOALS AGAINST", key: "ga", higher: false },
          { label: "GOAL DIFF", key: "gd", higher: true },
          { label: "POINTS", key: "pts", higher: true },
        ];
        return `<div class="table-container"><table class="standings-table"><thead><tr><th style="width: 42%; text-align: right; font-size: 15px; color: var(--text); padding: 16px;">${compareTeam1}</th><th style="width: 16%; text-align: center; color: var(--muted); font-size: 10px;">METRIC</th><th style="width: 42%; text-align: left; font-size: 15px; color: var(--text); padding: 16px;">${compareTeam2}</th></tr></thead><tbody>${rows
          .map((row) => {
            const v1 = s1[row.key],
              v2 = s2[row.key];
            const is1Better = row.higher ? v1 > v2 : v1 < v2;
            const is2Better = row.higher ? v2 > v1 : v2 < v1;
            const draw = v1 === v2;
            return `<tr><td style="text-align: right; font-family: 'JetBrains Mono', monospace; ${!draw && is1Better ? "color: var(--accent); font-weight: 600;" : "color: var(--muted);"}">${v1}</td><td style="text-align: center; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 1px;">${row.label}</td><td style="text-align: left; font-family: 'JetBrains Mono', monospace; ${!draw && is2Better ? "color: var(--accent); font-weight: 600;" : "color: var(--muted);"}">${v2}</td></tr>`;
          })
          .join(
            "",
          )}<tr><td style="text-align: right;"><div class="form-dots" style="justify-content: flex-end;">${s1.form.map((f) => `<div class="form-dot ${f}"></div>`).join("")}</div></td><td style="text-align: center; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 1px;">FORM</td><td style="text-align: left;"><div class="form-dots">${s2.form.map((f) => `<div class="form-dot ${f}"></div>`).join("")}</div></td></tr></tbody></table></div>`;
      }

      // OVERVIEW
      function renderOverview() {
        const el = document.getElementById("view-overview");
        const leagueIds = Object.keys(LEAGUES).filter((l) => l !== "CL");
        el.innerHTML = `
    <div style="margin-bottom:24px">
      <h1 style="font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FOOTBALL HUB 2025/26</h1>
      <p style="color:var(--muted);margin-top:4px;font-size:14px;">${Object.values(LEAGUES).join(" · ")}</p>
    </div>
    <div class="overview-grid">
      ${leagueIds
        .map(
          (lid) => `
        <div class="league-card" onclick="setView('${lid}')">
          <div class="league-card-header">
            <span class="league-card-flag">${FLAGS[lid]}</span>
            <div><div class="league-card-name">${LEAGUES[lid]}</div><div style="font-size:11px;color:var(--muted);">${TABLES[lid].length} teams</div></div>
          </div>
          <div class="league-card-body">
            ${TABLES[lid]
              .slice(0, 5)
              .map(
                (t, i) => `
              <div class="mini-table-row" onclick="event.stopPropagation();openTeam('${t.name}')">
                <span class="mini-pos">${i + 1}</span>
                ${teamLogoHtml(t.name, 20)}
                <span class="mini-name">${t.name}</span>
                <span class="mini-pts">${t.Pts}</span>
              </div>`,
              )
              .join("")}
          </div>
        </div>`,
        )
        .join("")}
      <div class="league-card" onclick="setView('CL')">
        <div class="league-card-header">
          <span class="league-card-flag">🏆</span>
          <div><div class="league-card-name">Champions League</div><div style="font-size:11px;color:var(--muted);">36 clubs · Group + KO</div></div>
        </div>
        <div class="league-card-body">
          ${CL_GROUP_TABLE.slice(0, 5)
            .map(
              (t, i) => `
            <div class="mini-table-row" onclick="event.stopPropagation();openTeam('${t.name}')">
              <span class="mini-pos">${i + 1}</span>
              ${teamLogoHtml(t.name, 20)}
              <span class="mini-name">${t.name}</span>
              <span class="mini-pts">${t.Pts}</span>
            </div>`,
            )
            .join("")}
        </div>
      </div>
    </div>`;
      }

      // ELO
      function renderElo() {
        const el = document.getElementById("view-elo");
        let allTeams = Object.entries(CLUB_STATS)
          .filter(([, s]) => s.elo)
          .sort((a, b) => b[1].elo - a[1].elo);

        if (eloLeagueFilter) {
          allTeams = allTeams.filter(([name, s]) => {
            if (eloLeagueFilter === "CL")
              return MATCHES[name]?.some((m) => m.competition === "CL");
            return s.primary_league === eloLeagueFilter;
          });
        }

        const maxElo = allTeams.length > 0 ? allTeams[0][1].elo : 0;
        const minElo =
          allTeams.length > 0 ? allTeams[allTeams.length - 1][1].elo : 0;

        el.innerHTML = `
    <div class="league-header">
      <span class="league-badge">📊</span>
      <span class="league-title">ELO RANKINGS</span>
      <div class="table-controls">
        <select class="filter-select" onchange="filterElo(this.value)">
          <option value="">All Leagues</option>
          ${Object.entries(LEAGUES)
            .map(
              ([id, name]) =>
                `<option value="${id}" ${eloLeagueFilter === id ? "selected" : ""}>${FLAGS[id]} ${name}</option>`,
            )
            .join("")}
        </select>
      </div>
      <span style="color:var(--muted);font-size:14px; margin-left: auto;">${allTeams.length} clubs ranked</span>
    </div>
    <div class="elo-grid">
      ${allTeams
        .map(([name, stats], i) => {
          const pct =
            maxElo === minElo
              ? 100
              : (((stats.elo - minElo) / (maxElo - minElo)) * 100).toFixed(1);
          const lid = stats.primary_league || "";
          return `<div class="elo-card" onclick="openTeam('${name}')">
          <div class="elo-rank ${i < 3 ? "top3" : ""}">${i + 1}</div>
          <div class="elo-info">
            <div class="elo-name">${name}</div>
            <div class="elo-league">${FLAGS[lid] || ""} ${LEAGUES[lid] || lid}</div>
            <div class="elo-bar-wrap"><div class="elo-bar" style="width:${pct}%"></div></div>
          </div>
          <div class="elo-value">${Math.round(stats.elo)}</div>
        </div>`;
        })
        .join("")}
    </div>`;
      }

      function filterElo(lid) {
        eloLeagueFilter = lid;
        renderElo();
      }

      // LEAGUE TABLE
      function getPosClass(pos, total, lid) {
        if (lid === "CL") {
          if (pos <= 8) return "pos-cl";
          if (pos <= 16) return "pos-el";
          return "pos-rel";
        }

        // League specific qualification rules
        if (lid === "GB1") {
          if (pos <= 5) return "pos-cl";
          if (pos <= 7) return "pos-el";
          if (pos === 8) return "pos-conf";
        } else if (lid === "ES1") {
          if (pos <= 5) return "pos-cl";
          if (pos === 6) return "pos-el";
          if (pos === 7) return "pos-conf";
        } else if (lid === "L1" || lid === "IT1") {
          if (pos <= 4) return "pos-cl";
          if (pos <= 6) return "pos-el";
          if (pos === 7) return "pos-conf";
        } else if (lid === "FR1") {
          if (pos <= 4) return "pos-cl";
          if (pos === 5) return "pos-el";
          if (pos === 6) return "pos-conf";
        }

        if (pos >= total - 2) return "pos-rel";
        return "pos-normal";
      }

      function buildStandingsTable(
        rows,
        lid,
        sortKey,
        sortAsc,
        onSortFn,
        totalTeams,
      ) {
        const cols = [
          { key: "#", label: "#", nosort: true },
          { key: "name", label: "Team" },
          { key: "P", label: "P" },
          { key: "W", label: "W" },
          { key: "D", label: "D" },
          { key: "L", label: "L" },
          { key: "GF", label: "GF" },
          { key: "GA", label: "GA" },
          { key: "GD", label: "GD" },
          { key: "Pts", label: "PTS" },
          { key: "form", label: "Form", nosort: true },
        ];
        return `<div class="table-container">
    <table class="standings-table">
      <thead><tr>
        ${cols
          .map(
            (
              c,
            ) => `<th class="${["Pts", "W", "D", "L", "GF", "GA", "GD", "P"].includes(c.key) ? "stat-cell" : ""} ${!c.nosort && sortKey === c.key ? "sorted sorted-" + (sortAsc ? "asc" : "desc") : ""}"
          ${!c.nosort ? `onclick="${onSortFn}('${c.key}')"` : ""}>
          ${c.label}<span class="sort-arrow"></span></th>`,
          )
          .join("")}
      </tr></thead>
      <tbody>
        ${rows
          .map((r, idx) => {
            const origPos = idx + 1;
            const posClass = getPosClass(origPos, totalTeams, lid);
            const elo = CLUB_STATS[r.name]?.elo;
            return `<tr onclick="openTeam('${r.name}')">
            <td class="pos-cell"><span class="pos-marker ${posClass}">${origPos}</span></td>
            <td><div class="team-cell">
              ${teamLogoHtml(r.name, 28)}
              <span>${r.name}</span>
              ${elo ? `<span style="font-size:11px;color:var(--muted);margin-left:4px;">(${Math.round(elo)})</span>` : ""}
            </div></td>
            <td class="stat-cell">${r.P}</td>
            <td class="stat-cell" style="color:var(--win)">${r.W}</td>
            <td class="stat-cell" style="color:var(--draw)">${r.D}</td>
            <td class="stat-cell" style="color:var(--loss)">${r.L}</td>
            <td class="stat-cell">${r.GF}</td>
            <td class="stat-cell">${r.GA}</td>
            <td class="stat-cell ${r.GD > 0 ? "gd-positive" : r.GD < 0 ? "gd-negative" : ""}">${r.GD > 0 ? "+" : ""}${r.GD}</td>
            <td class="pts-cell">${r.Pts}</td>
            <td><div class="form-dots">${r.form.map((f) => `<div class="form-dot ${f}" title="${f === "W" ? "Win" : f === "D" ? "Draw" : "Loss"}"></div>`).join("")}</div></td>
          </tr>`;
          })
          .join("")}
      </tbody>
    </table>
  </div>`;
      }

      function renderLeague(lid) {
        if (!sortState[lid]) sortState[lid] = { col: "Pts", asc: false };
        const el = document.getElementById("view-" + lid);
        const { col, asc } = sortState[lid];
        const rows = [...TABLES[lid]].sort((a, b) => {
          let av = a[col],
            bv = b[col];
          if (col === "name") {
            av = av.toLowerCase();
            bv = bv.toLowerCase();
          }
          return av < bv ? (asc ? -1 : 1) : av > bv ? (asc ? 1 : -1) : 0;
        });
        el.innerHTML = `
    <div class="league-header">
      <span class="league-badge">${FLAGS[lid]}</span>
      <span class="league-title">${LEAGUES[lid]}</span>
      <div class="table-controls">
        <select class="filter-select" id="filterSelect-${lid}" onchange="filterTable('${lid}')">
          <option value="">All Teams</option>
          ${TABLES[lid].map((r) => `<option value="${r.name}">${r.name}</option>`).join("")}
        </select>
        <button class="filter-select" onclick="resetSort('${lid}')" style="cursor:pointer;">Reset Sort</button>
      </div>
    </div>
    ${buildStandingsTable(rows, lid, col, asc, `sortLeague.bind(null,'${lid}')`, TABLES[lid].length)}
    <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);">
      <span><span class="pos-marker pos-cl" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> ${lid === "FR1" ? "CL / CL Qual" : "Champions League"}</span>
      <span><span class="pos-marker pos-el" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Europa League</span>
      <span><span class="pos-marker pos-conf" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Conference</span>
      <span><span class="pos-marker pos-rel" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Relegation</span>
    </div>`;
      }

      function sortLeague(lid, col) {
        if (sortState[lid].col === col)
          sortState[lid].asc = !sortState[lid].asc;
        else sortState[lid] = { col, asc: col === "name" };
        renderLeague(lid);
      }

      function resetSort(lid) {

        rows.forEach((r) => {

        });

      // CL VIEW
      function setCLMode(mode) {
        clViewMode = mode;
        renderCL();
      }

      function sortCLGroup(col) {
        if (clSortState.col === col) clSortState.asc = !clSortState.asc;
        else clSortState = { col, asc: col === "name" };
        renderCL();
      }

      function renderCL() {
        const el = document.getElementById("view-CL");

        // Build KO games
        const clGames = [];
        const seen = new Set();
        for (const [team, ms] of Object.entries(MATCHES)) {
          for (const m of ms) {
            if (m.competition !== "CL") continue;
            const key = [m.date, team, m.opponent].sort().join("|");
            if (seen.has(key)) continue;
            seen.add(key);
            clGames.push({
              ...m,
              home: m.venue === "H" ? team : m.opponent,
              away: m.venue === "A" ? team : m.opponent,
              homeGoals: m.venue === "H" ? m.gf : m.ga,
              awayGoals: m.venue === "H" ? m.ga : m.gf,
            });
          }
        }
        const rounds = {};
        for (const g of clGames) {
          if (!rounds[g.round]) rounds[g.round] = [];
          rounds[g.round].push(g);
        }
        const koRoundOrder = [
          "intermediate stage 1st leg",
          "intermediate stage 2nd leg",
          "Last 16 1st Leg",
          "Last 16 2nd Leg",
          "Quarter-Finals 1st Leg",
          "Quarter-Finals 2nd Leg",
          "Semi-Finals 1st Leg",
          "Semi-Finals 2nd Leg",
        ];

        // Sort group table
        const { col, asc } = clSortState;
        const groupRows = [...CL_GROUP_TABLE].sort((a, b) => {
          let av = a[col],
            bv = b[col];
          if (col === "name") {
            av = av.toLowerCase();
            bv = bv.toLowerCase();
          }
          return av < bv ? (asc ? -1 : 1) : av > bv ? (asc ? 1 : -1) : 0;
        });

        el.innerHTML = `
    <div class="league-header" style="margin-bottom:16px;">
      <span class="league-badge">🏆</span>
      <span class="league-title">Champions League</span>
      <div class="toggle-group" style="margin-left:auto;">
        <button class="toggle-btn ${clViewMode === "group" ? "active" : ""}" onclick="setCLMode('group')">📋 Group Stage Table</button>
        <button class="toggle-btn ${clViewMode === "knockout" ? "active" : ""}" onclick="setCLMode('knockout')">🏆 Knockout Rounds</button>
      </div>
    </div>

    <div id="cl-group-panel" style="display:${clViewMode === "group" ? "block" : "none"}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
        <div style="font-size:13px;color:var(--muted);">36 clubs · 8 matchdays each · Group Stage only</div>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <select class="filter-select" id="cl-group-filter" onchange="filterCLGroup()">
            <option value="">All Teams</option>
            ${CL_GROUP_TABLE.map((r) => `<option value="${r.name}">${r.name}</option>`).join("")}
          </select>
          <button class="filter-select" onclick="resetCLSort()" style="cursor:pointer;">Reset</button>
        </div>
      </div>
      ${buildStandingsTable(groupRows, "CL", col, asc, "sortCLGroup", CL_GROUP_TABLE.length)}
      <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);">
        <span><span class="pos-marker pos-cl" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Auto qualify to Last 16 (top 8)</span>
        <span><span class="pos-marker pos-el" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Playoff round (9–16)</span>
        <span><span class="pos-marker pos-rel" style="display:inline-flex;margin-right:4px;width:16px;height:16px;font-size:10px;">·</span> Eliminated (17–36)</span>
      </div>
    </div>

    <div id="cl-knockout-panel" style="display:${clViewMode === "knockout" ? "block" : "none"}">
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Click any match to view team profile</div>
      <div class="bracket-container">
        ${koRoundOrder
          .filter((r) => rounds[r])
          .map(
            (round) => `
          <div class="bracket-round">
            <div class="bracket-round-title">${round.replace(" 1st leg", " · Leg 1").replace(" 2nd leg", " · Leg 2").replace(" 1st Leg", " · Leg 1").replace(" 2nd Leg", " · Leg 2").toUpperCase()}</div>
            ${rounds[round]
              .map((g) => {
                const homeWin = g.homeGoals > g.awayGoals,
                  awayWin = g.awayGoals > g.homeGoals;
                return `<div class="bracket-match">
                <div class="bracket-team ${homeWin ? "winner" : awayWin ? "loser" : ""}" onclick="openTeam('${g.home}')">
                  <span>${g.home}</span><span class="bracket-score">${g.homeGoals}</span>
                </div>
                <div class="bracket-divider"></div>
                <div class="bracket-team ${awayWin ? "winner" : homeWin ? "loser" : ""}" onclick="openTeam('${g.away}')">

                </div>

              </div>`;

              .join("")}

          .join("")}
      </div>

      function filterCLGroup() {
        const val =
          document.getElementById("cl-group-filter")?.value?.toLowerCase() ||
          "";
        document
          .querySelectorAll("#cl-group-panel .standings-table tbody tr")
          .forEach((r) => {
            const name =
              r.querySelector(".team-cell span")?.textContent?.toLowerCase() ||
              "";
            r.style.display = !val || name.includes(val) ? "" : "none";
          });
      }

      function resetCLSort() {
        clSortState = { col: "Pts", asc: false };
        const f = document.getElementById("cl-group-filter");
        if (f) f.value = "";
        renderCL();
      }

      // TEAM MODAL
      function openTeam(name) {
        const ms = MATCHES[name] || [];
        const stats = CLUB_STATS[name] || {};
        let W = 0,
          D = 0,
          L = 0,
          GF = 0,
          GA = 0;
        for (const m of ms) {
          GF += m.gf;
          GA += m.ga;
          if (m.gf > m.ga) W++;
          else if (m.gf === m.ga) D++;
          else L++;
        }
        const allComps = [...new Set(ms.map((m) => m.competition))];
        matchFilterState[name] = matchFilterState[name] || "all";
        document.getElementById("modal").innerHTML = buildTeamModal(
          name,
          ms,
          stats,
          W,
          D,
          L,
          GF,
          GA,
          allComps,
        );
        document.getElementById("modalOverlay").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function buildTeamModal(name, ms, stats, W, D, L, GF, GA, allComps) {
        const lid = stats.primary_league || "";
        const filterVal = matchFilterState[name] || "all";
        const filteredMs =
          filterVal === "all"
            ? ms
            : ms.filter((m) => m.competition === filterVal);
        const sortedMs = [...filteredMs].sort((a, b) =>
          b.date.localeCompare(a.date),
        );
        const elo = stats.elo ? Math.round(stats.elo) : null;
        return `
    <div class="modal-header">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:52px;height:52px;flex-shrink:0;">${teamLogoHtml(name, 52)}</div>
        <div>
          <div class="modal-team-name">${name}</div>
          <div class="modal-meta">
            ${lid ? `<span class="modal-stat-badge league-badge-small">${FLAGS[lid] || ""} ${LEAGUES[lid] || lid}</span>` : ""}
            ${elo ? `<span class="modal-stat-badge elo-badge">ELO ${elo}</span>` : ""}
            <span class="modal-stat-badge" style="color:var(--muted)">${ms.length} matches</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-stats-grid">
        <div class="mini-stat"><div class="mini-stat-value">${ms.length}</div><div class="mini-stat-label">Played</div></div>
        <div class="mini-stat"><div class="mini-stat-value win-value">${W}</div><div class="mini-stat-label">Wins</div></div>
        <div class="mini-stat"><div class="mini-stat-value draw-value">${D}</div><div class="mini-stat-label">Draws</div></div>
        <div class="mini-stat"><div class="mini-stat-value loss-value">${L}</div><div class="mini-stat-label">Losses</div></div>
        <div class="mini-stat"><div class="mini-stat-value" style="color:var(--accent)">${GF}</div><div class="mini-stat-label">Goals For</div></div>
        <div class="mini-stat"><div class="mini-stat-value" style="color:var(--muted)">${GA}</div><div class="mini-stat-label">Goals Against</div></div>
        <div class="mini-stat"><div class="mini-stat-value ${GF - GA >= 0 ? "win-value" : "loss-value"}">${GF - GA >= 0 ? "+" : ""}${GF - GA}</div><div class="mini-stat-label">Goal Diff</div></div>
        <div class="mini-stat"><div class="mini-stat-value">${W * 3 + D}</div><div class="mini-stat-label">Points</div></div>
      </div>
      <div class="section-title">MATCH HISTORY</div>
      <div class="filter-pills">
        <span class="pill ${filterVal === "all" ? "active" : ""}" onclick="setMatchFilter('${name}','all')">All Competitions</span>

      function setMatchFilter(name, comp) {

          D = 0,
          L = 0,
          GF = 0,
          GA = 0;
        for (const m of ms) {
          GF += m.gf;
          GA += m.ga;
          if (m.gf > m.ga) W++;
          else if (m.gf === m.ga) D++;
          else L++;
        }
        const allComps = [...new Set(ms.map((m) => m.competition))];
        document.getElementById("modal").innerHTML = buildTeamModal(
          name,
          ms,
          stats,
          W,
          D,
          L,
          GF,
          GA,

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("open");

      // SEARCH
      function buildSearch() {
        const input = document.getElementById("searchInput");
        const results = document.getElementById("searchResults");
        const allTeams = Object.keys(MATCHES).sort();
        input.addEventListener("input", () => {
          const q = input.value.toLowerCase().trim();
          if (!q) {
            results.classList.remove("open");
            return;
          }
          const ms = allTeams
            .filter((t) => t.toLowerCase().includes(q))
            .slice(0, 12);
          if (!ms.length) {
            results.classList.remove("open");
            return;
          }
          results.innerHTML = ms
            .map((t) => {
              const lid = CLUB_STATS[t]?.primary_league || "";
              return `<div class="search-result-item" onclick="searchSelect('${t}')"><span>${t}</span><span class="search-result-league">${FLAGS[lid] || ""} ${LEAGUES[lid] || lid}</span></div>`;
            })
            .join("");
          results.classList.add("open");
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".search-wrap"))
            results.classList.remove("open");
        });
      }
      function searchSelect(name) {
        document.getElementById("searchInput").value = name;
        document.getElementById("searchResults").classList.remove("open");

      };

      function pTeamColor(name) {
        const COLS = [
          "#e74c3c",
          "#3498db",
          "#2ecc71",
          "#f39c12",
          "#9b59b6",
          "#1abc9c",
          "#e67e22",
          "#34495e",
          "#e91e63",
          "#00bcd4",
          "#ff5722",
          "#607d8b",
          "#795548",
          "#4caf50",
          "#ff9800",
          "#2196f3",
          "#673ab7",
          "#009688",
        ];
        let hash = 0;
        for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
        return COLS[Math.abs(hash) % COLS.length];
      }
      function pInitials(name) {
        return name
          .split(" ")
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }

      function poissonPMF(k, lam) {
        if (lam <= 0) return k === 0 ? 1 : 0;
        let logP = -lam + k * Math.log(lam);
        for (let i = 1; i <= k; i++) logP -= Math.log(i);
        return Math.exp(logP);
      }

      function formMult(results, weight) {
        // results: array of 'W','D','L'. Returns multiplier centred at 1.0.
        // weight=0.20 → range [0.90, 1.10]
        if (!results || !results.length) return 1.0;
        const pts =
          results.reduce((s, r) => s + (r === "W" ? 3 : r === "D" ? 1 : 0), 0) /
          (3 * results.length);
        return 1.0 - weight / 2 + weight * pts;
      }

      function runPrediction(homeTeam, awayTeam, neutral) {
        const s = PRED.strengths;
        const sh = s[homeTeam] || { ha: 1, hd: 1, aa: 1, ad: 1 };
        const sa = s[awayTeam] || { ha: 1, hd: 1, aa: 1, ad: 1 };
        const avg_h = PRED.avg_home,
          avg_a = PRED.avg_away;

        // ── Base expected goals (Poisson attack×defence model) ──
        // Home λ  = home_att_strength × away_def_weakness × league_avg_home_goals
        //   home_att_strength: how many goals this team scores at home vs league avg
        //   away_def_weakness: how many goals this opponent concedes away vs league avg
        // Away λ  = away_att_strength × home_def_weakness × league_avg_away_goals
        let lh, la, baseH, baseA;
        if (neutral) {
          const hAtt = (sh.ha + sh.aa) / 2;
          const hDef = (sh.hd + sh.ad) / 2;
          const aAtt = (sa.ha + sa.aa) / 2;
          const aDef = (sa.hd + sa.ad) / 2;
          const avgG = (avg_h + avg_a) / 2;
          baseH = hAtt * aDef * avgG;
          baseA = aAtt * hDef * avgG;
        } else {
          baseH = sh.ha * sa.ad * avg_h;
          baseA = sa.aa * sh.hd * avg_a;
        }
        lh = baseH;
        la = baseA;

        // ── Recent form adjustment (±10% max) ──
        // Home team's last-5-home form nudges their attack λ up/down
        // Away team's last-5-away form nudges their attack λ up/down
        const hFormArr = neutral
          ? [
              ...(PRED.home_form[homeTeam] || []),
              ...(PRED.away_form[homeTeam] || []),
            ].slice(-5)
          : PRED.home_form[homeTeam] || [];
        const aFormArr = neutral
          ? [
              ...(PRED.home_form[awayTeam] || []),
              ...(PRED.away_form[awayTeam] || []),
            ].slice(-5)
          : PRED.away_form[awayTeam] || [];

        const hFormMult = formMult(hFormArr, 0.2);
        const aFormMult = formMult(aFormArr, 0.2);
        lh = lh * hFormMult;
        la = la * aFormMult;

        // ── ELO adjustment (±10% max) ──
        // Based on Elo expected score formula; 400-point gap = ~64% win probability
        const eloH = PRED.elos[homeTeam] || 1500;
        const eloA = PRED.elos[awayTeam] || 1500;
        const eloDiff = (eloH - eloA) / 400;
        const eloExp = Math.pow(10, eloDiff) / (1 + Math.pow(10, eloDiff));
        const eloAdj = 0.1 * (eloExp - 0.5); // [-0.05, +0.05]
        lh = Math.max(0.1, lh * (1 + eloAdj));
        la = Math.max(0.1, la * (1 - eloAdj));

        // ── Score probability matrix ──
        // P(home=i, away=j) = Poisson(i,λh) × Poisson(j,λa)
        // Assumes home and away goals are independent (standard Poisson model)
        const MAX = 9;
        let prob = [];
        for (let i = 0; i <= MAX; i++) {
          prob[i] = [];
          for (let j = 0; j <= MAX; j++)
            prob[i][j] = poissonPMF(i, lh) * poissonPMF(j, la);
        }

        // ── Aggregate outcome probabilities ──
        let homeWin = 0,
          draw = 0,
          awayWin = 0;
        for (let i = 0; i <= MAX; i++)
          for (let j = 0; j <= MAX; j++) {
            if (i > j) homeWin += prob[i][j];
            else if (i === j) draw += prob[i][j];
            else awayWin += prob[i][j];
          }

        // ── Top scorelines (sorted by joint probability) ──
        let flat = [];
        for (let i = 0; i <= MAX; i++)
          for (let j = 0; j <= MAX; j++)
            flat.push({ score: `${i}:${j}`, p: prob[i][j], hi: i, aj: j });
        flat.sort((a, b) => b.p - a.p);

        return {
          homeWin: +(homeWin * 100).toFixed(1),
          draw: +(draw * 100).toFixed(1),
          awayWin: +(awayWin * 100).toFixed(1),
          lambdaH: +lh.toFixed(2),
          lambdaA: +la.toFixed(2),
          baseH: +baseH.toFixed(2),
          baseA: +baseA.toFixed(2),
          hFormMult: +hFormMult.toFixed(3),
          aFormMult: +aFormMult.toFixed(3),
          hFormArr,
          aFormArr,
          topScores: flat.slice(0, 6),
          eloH,
          eloA,
          eloAdj: +eloAdj.toFixed(3),
          strengthH: sh,
          strengthA: sa,
        };
      }
